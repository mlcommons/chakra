name: Clean Install Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Check Clean Install
      run: |
        PYTHON=python FAILURE_ARTIFACTS_DIR="${RUNNER_TEMP}/clean-install-failure" scripts/check_clean_install.sh

    - name: Upload logs and traces of the failed run
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: clean-install-${{ matrix.python-version }}
        path: ${{ runner.temp }}/clean-install-failure
        if-no-files-found: ignore
        retention-days: 7
