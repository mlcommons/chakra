name: Feeder tests

on: [ push, pull_request ]

jobs:
  feeder-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Install protoc
      run: |
        sudo apt update
        sudo apt install protobuf-compiler libprotobuf-dev
    - name: Install Google Test Framework
      run: |
        sudo apt update
        sudo apt install libgtest-dev
    - name: Extract trace for feeder tests
      run: tar -xvf tests/data/feeder_tests_trace.tar.gz
    - name: Build
      run: |
        SCRIPT_DIR=.
        BUILD_DIR="${SCRIPT_DIR:?}"/build
        CHAKRA_ET_DIR="${SCRIPT_DIR:?}"/schema/protobuf
        INCLUDES="-I src/third_party/utils -I schema/protobuf -I src/feeder"

        protoc "${CHAKRA_ET_DIR:?}"/*.proto \
          --proto_path="${CHAKRA_ET_DIR:?}" \
          --cpp_out="${CHAKRA_ET_DIR:?}"

        PB_OBJECTS=""
        for cc in "${CHAKRA_ET_DIR:?}"/*.pb.cc; do
          obj="${cc%.cc}.o"
          g++ -Wall ${INCLUDES} -c "${cc}" -o "${obj}"
          PB_OBJECTS="${PB_OBJECTS} ${obj}"
        done
        g++ -Wall ${INCLUDES} -c src/feeder/et_feeder.cpp -o src/feeder/et_feeder.o
        g++ -Wall ${INCLUDES} -c src/feeder/et_feeder_node.cpp -o src/feeder/et_feeder_node.o
        g++ -Wall ${INCLUDES} -c src/third_party/utils/protoio.cc -o src/third_party/utils/protoio.o
        g++ -Wall ${INCLUDES} -c tests/feeder/tests.cpp -o tests/feeder/tests.o
        g++ -Wall ${INCLUDES} -o feeder_tests ${PB_OBJECTS} src/feeder/et_feeder.o src/feeder/et_feeder_node.o src/third_party/utils/protoio.o tests/feeder/tests.o -lgtest -lgtest_main -lprotobuf -lpthread
    - name: Run tests
      run: ./feeder_tests
