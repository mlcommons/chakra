[build-system]
requires = ["setuptools>=61", "setuptools-scm==10.3.4", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlc-chakra"
requires-python = ">=3.11"
dynamic = ["version"]
readme = "README.md"
license = {file = "LICENSE.md"}
authors = [
    {name = "MLCommons", email = "chakra@mlcommons.org"},
]
dependencies = [
    "protobuf>=6.31.1,<8", # not older than the committed gencode (scripts/gen_proto.sh)
    "graphviz",
    "networkx!=3.6.0", # 3.6.0 breaks DiGraph subclasses with extra __init__ args (hta CPGraph); fixed in 3.6.1
    "pydot",
    "traceinsight>=0.6.1,<1.0" # HolisticTraceAnalysis (HTA) which was renamed on PyPI; still imports as hta
]

[project.urls]
Homepage = "https://github.com/mlcommons/chakra"
Documentation = "https://github.com/mlcommons/chakra/README.md"
Repository = "https://github.com/mlcommons/chakra.git"

# The version comes from the newest git tag vX.Y.Z (see .github/workflows/tag_version.yml).
[tool.setuptools_scm]

[tool.setuptools.package-dir]
"chakra" = "src/chakra_pkg"
"chakra.schema.protobuf" = "schema/protobuf"
"chakra.src.converter" = "src/converter"
"chakra.src.generator" = "src/generator"
"chakra.src.host_trace" = "src/host_trace"
"chakra.src.jsonizer" = "src/jsonizer"
"chakra.src.third_party" = "src/third_party"
"chakra.src.timeline_visualizer" = "src/timeline_visualizer"
"chakra.src.trace_link" = "src/trace_link"
"chakra.src.visualizer" = "src/visualizer"

[tool.setuptools.package-data]
# setuptools<69 drops .pyi files that are not listed
"chakra.schema.protobuf" = ["et_def.proto", "storage.proto", "et_def_pb2.pyi", "storage_pb2.pyi"]

[project.scripts]
chakra_converter = "chakra.src.converter.converter:main"
chakra_generator = "chakra.src.generator.generator:main"
chakra_jsonizer = "chakra.src.jsonizer.jsonizer:main"
chakra_timeline_visualizer = "chakra.src.timeline_visualizer.timeline_visualizer:main"
chakra_trace_link = "chakra.src.trace_link.trace_link:main"
chakra_visualizer = "chakra.src.visualizer.visualizer:main"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    "schema/protobuf/*_pb2.py*", # generated
    "src/converter/text_converter.py",
    "src/third_party/utils/protolib.py",
]

[tool.ruff.lint]
select = ["I", "B", "E", "D", "F", "SIM", "W", "C90", "EXE"]
ignore = [
    "D407", # Missing dashed underline after section
    "D203", # conflicts with D211
    "D212", # conflicts with D213
    "D413", # Missing blank line after last section

    # TODO: Remove these once we have docstrings
    "D100", # Missing docstring in public module
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D107", # Missing docstring in `__init__`
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D"]

[tool.ruff.format]
indent-style = "space"

[tool.pyright]
typeCheckingMode = "basic"
exclude = [
    "**/__pycache__",
    "**/build/",
    "schema/protobuf/*_pb2.py", # generated
    "setup.py",
    "src/third_party/utils/protolib.py",
]
reportMissingImports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.vulture]
ignore_names = ["mock_process_thread"]
min_confidence = 100

# Developer environment for uv (`uv sync`). These pins equal requirements-dev.txt until that file is retired.
[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.6",
    "vulture==2.11",
    "build==1.6.1",
    "twine==7.0.0",
]

[tool.uv]
default-groups = ["dev"]
# chakra has an __init__.py (for __version__), and the default editable finder cannot resolve chakra.src.* under it.
# strict links the files into a tree with the same layout as the wheel.
config-settings = { editable_mode = "strict" }
# Rebuild when a module is added, so that it is linked into the strict editable tree. The default keys miss it.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "src/**/*.py" },
]
